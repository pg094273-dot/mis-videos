<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mis Videos · Biblioteca personal</title>
<meta name="description" content="Biblioteca personal de vídeos de YouTube: añade enlaces, organízalos en listas y escúchalos con el móvil bloqueado.">

<!-- PWA / iOS -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1020" id="metaThemeColor">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Videos">
<meta name="format-detection" content="telephone=no">
<!-- YouTube devuelve el error 153 si no recibe una cabecera Referer válida.
     Esta etiqueta garantiza que siempre se envíe el origen. -->
<meta name="referrer" content="origin-when-cross-origin">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Aviso para iOS cuando se abre fuera de la app instalada -->
<div class="a2hs" id="a2hs" hidden>
  <div class="a2hs-card">
    <img src="icons/icon-180.png" alt="" width="44" height="44">
    <div>
      <strong>Añádelo a la pantalla de inicio</strong>
      <p id="a2hsText">Toca <b>Compartir</b> → <b>Añadir a pantalla de inicio</b>. Se abrirá a pantalla completa y seguirá sonando con el móvil bloqueado.</p>
    </div>
    <button class="icon-btn" id="a2hsClose" aria-label="Cerrar">✕</button>
  </div>
</div>

<div class="app" id="app">

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Inicio">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.72-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/></svg>
      </span>
      <span class="brand-txt">
        <strong>Mis Videos</strong>
        <small id="brandSub">tu biblioteca</small>
      </span>
    </a>

    <div class="search" role="search">
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.65 10.77l4.13 4.13 1.41-1.41-4.13-4.13A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input id="searchInput" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
             placeholder="Buscar vídeos, listas, autores…" aria-label="Buscar">
      <button class="clear-btn" id="searchClear" hidden aria-label="Limpiar búsqueda">✕</button>
    </div>

    <div class="actions">
      <button class="icon-btn" id="themeBtn" title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Zm0-14 2 3h-4l2-3Zm0 16-2-3h4l-2 3ZM4 12l3-2v4l-3-2Zm16 0-3 2v-4l3 2Z"/></svg>
      </button>
      <button class="btn btn-primary" id="addBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
        <span>Añadir</span>
      </button>
    </div>
  </header>

  <div class="filters" id="filterBar" hidden>
    <div class="chips" id="filterChips"></div>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <button class="fab" id="fab" aria-label="Añadir vídeo">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
  </button>

  <nav class="tabbar" aria-label="Navegación principal">
    <a class="tab" href="#/" data-tab="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3Z"/></svg>
      <span>Inicio</span>
    </a>
    <a class="tab" href="#/listas" data-tab="/listas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5h3v14H4V5Zm5 0h3v14H9V5Zm5.6 0 3.9 13.2-2.9.86L11.6 5h3Z"/></svg>
      <span>Listas</span>
    </a>
    <a class="tab" href="#/favoritos" data-tab="/favoritos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 3.6 2.6 5.3 5.9.86-4.25 4.14 1 5.86L12 17l-5.25 2.76 1-5.86L3.5 9.76l5.9-.86L12 3.6Z"/></svg>
      <span>Favoritos</span>
    </a>
    <a class="tab" href="#/pendientes" data-tab="/pendientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 10.6 4 2.3-1 1.7-5-2.9V6h2v6.6Z"/></svg>
      <span>Pendientes</span>
    </a>
    <a class="tab" href="#/ajustes" data-tab="/ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.9 4c0-.6-.06-1.2-.17-1.7l2-1.5-2-3.4-2.4.9a7.7 7.7 0 0 0-1.5-.87L16.5 3h-4l-.33 2.5c-.54.2-1.04.5-1.5.87l-2.4-.9-2 3.4 2 1.5a7.9 7.9 0 0 0 0 3.4l-2 1.5 2 3.4 2.4-.9c.46.36.96.66 1.5.87L12.5 21h4l.33-2.5c.54-.2 1.04-.5 1.5-.87l2.4.9 2-3.4-2-1.5c.1-.5.17-1.1.17-1.6Z"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <!-- Reproductor persistente (fijo: nunca se desmonta para no cortar el audio) -->
  <div class="stage" id="stage" aria-hidden="true">
    <div class="stage-inner" id="ytHost"></div>
  </div>

  <div class="miniplayer" id="miniplayer" hidden>
    <img id="miniThumb" alt="" width="52" height="30">
    <div class="mini-info">
      <strong id="miniTitle">—</strong>
      <small id="miniSub">—</small>
    </div>
    <button class="icon-btn" id="miniPrev" aria-label="Anterior">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 6h2v12H7V6Zm3 6 8-6v12l-8-6Z"/></svg>
    </button>
    <button class="icon-btn accent" id="miniPlay" aria-label="Reproducir/Pausa">
      <svg viewBox="0 0 24 24" width="22" height="22" id="miniPlayIcon"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.72-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/></svg>
    </button>
    <button class="icon-btn" id="miniNext" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15 6h2v12h-2V6Zm-1 6L6 18V6l8 6Z"/></svg>
    </button>
    <button class="icon-btn" id="miniClose" aria-label="Cerrar reproductor">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></svg>
    </button>
  </div>

</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:24px;font:16px/1.5 system-ui">Esta aplicación necesita JavaScript activado.</div>
</noscript>

<script src="js/store.js"></script>
<script src="js/youtube.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
